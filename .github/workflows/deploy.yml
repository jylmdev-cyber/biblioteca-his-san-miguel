name: Despliegue en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilación y validaciones
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configurar URL y Base Path de GitHub Pages
        shell: bash
        run: |
          echo "PUBLIC_SITE_URL=https://${{ github.repository_owner }}.github.io" >> "$GITHUB_ENV"
          if [[ "${{ github.event.repository.name }}" == "${{ github.repository_owner }}.github.io" ]]; then
            echo "PUBLIC_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "PUBLIC_BASE_PATH=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          fi

      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Validar integridad del catálogo
        run: npm run audit:catalog

      - name: Validar componentes de interfaz
        run: npm run audit:ui

      - name: Auditar contraste de accesibilidad (WCAG AA)
        run: npm run audit:contrast

      - name: Verificar TypeScript y componentes Astro
        run: npm run check

      - name: Sincronizar PDFs oficiales para visor local
        run: npm run sync:pdf

      - name: Validar archivo histórico
        run: npm run audit:history

      - name: Compilar sitio estático (Astro Build)
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir artefacto de publicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Despliegue en producción
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
